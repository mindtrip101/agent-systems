services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=dev-secret-change-me
      - AUDIT_LOG_PATH=/app/audit.log.jsonl
      - APPROVAL_DB_PATH=/app/approvals.db.json
    volumes:
      - ./audit.log.jsonl:/app/audit.log.jsonl
      - ./approvals.db.json:/app/approvals.db.json
